name: DocuFlow CI/CD Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Crucial for git diff analysis

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Verify Python Compilation
      run: |
        python -m py_compile src/docuflow/*.py

    - name: Run Test Suite
      run: |
        python -m unittest discover -s tests

    - name: Audit Documentation Quality (Check Command)
      run: |
        docuflow check
